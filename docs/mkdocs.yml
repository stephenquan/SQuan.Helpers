site_name: Stephen Quan
site_url: https://stephenquan.github.io/
theme:
  name: material
  custom_dir: overrides
  font:
    text: Roboto
    code: Red Hat Mono
  icon:
    logo: fontawesome/solid/toolbox
  features:
    - content.code.copy
    - navigation.indexes
  palette:
    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Light mode
      primary: green
      accent: deep purple

    # Dark Mode
    - scheme: slate
      toggle:
          icon: material/weather-night
          name: Dark mode
      primary: green
      accent: deep purple 

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/stephen-quan-b2b44636
    - icon: fontawesome/brands/github
      link: https://github.com/stephenquan
    - icon: fontawesome/brands/stack-exchange
      link: https://stackoverflow.com/users/881441/stephen-quan

copyright: Copyright &copy; 2026 Stephen Quan
